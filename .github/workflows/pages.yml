name: Publish Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build_local.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tools/core.test.mjs tools/direct-open.test.mjs tools/oliver-data.test.mjs
      - name: Prepare public files
        run: |
          mkdir -p _public/data
          cp index.html .nojekyll _public/
          cp -r site _public/
          cp data/catalog.json _public/data/
          cp -r data/sets data/generated _public/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
